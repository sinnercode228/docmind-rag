[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "docmind"
version = "0.1.0"
description = "DocMind: multi-tenant RAG document assistant (FastAPI, pgvector, Claude, Telegram)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "sinnercode228" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "numpy>=2.1",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "anthropic>=1.8",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30", "pgvector>=0.3"]
telegram = ["aiogram>=3.13"]
dev = [
  "asyncpg>=0.30",
  "pgvector>=0.3",
  "aiogram>=3.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
]

[project.scripts]
docmind = "docmind.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
  "integration: requires external services (Postgres + pgvector); skipped unless DOCMIND_TEST_PG_URL is set",
]

[tool.coverage.run]
source = ["docmind"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "C4"]
ignore = [
  "S101",   # assert is fine in tests
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "RUF001", # Cyrillic text in strings is intentional (bilingual bot/UI copy)
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "PT018", "PT022", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["docmind"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "docx.*", "asyncpg.*"]
ignore_missing_imports = true
